[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
# Erros reais (pyflakes/pycodestyle) + ordenacao de imports. E501 (linha longa)
# fica de fora para nao exigir reformatacao ampla.
select = ["E", "F", "I"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
no_implicit_optional = true
files = ["src"]
